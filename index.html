<!DOCTYPE html>
<html>
<head>
<title>PS4 Jailbreak 7.00 - 13.00</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#031027">
<meta name="description" content="ZoLDiK PS4 Host - Fast offline-ready jailbreak host for PS4 firmware 7.00 to 13.00">
<link rel="stylesheet" href="style.css">
</head>
<body class="g2all-page">
<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

function onScriptError() {
    msgs.innerHTML = "Content not Found! - Clear Browser Data and Re-Install Cache ...";
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        msgs.innerHTML = "Only for PS4 with Firmware 7.00 to 13.00";
    });
} else {
    if (window.applicationCache.status == '0') {
        if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 13.00) {
            window.location.replace("cacheslopkit.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                msgs.innerHTML = 'Unsupported Firmware: <span style="color: red;">' + fwVersion + '</span>';
            });
        }
    } else {
        if (fwNum >= 7.00 && fwNum <= 8.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "700/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    doJb();
                }, 500);
            };
            document.head.appendChild(script);
        }
        else if (fwNum >= 11.50 && fwNum <= 12.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.50 && fwNum <= 13.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_poops.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    }
}
document.addEventListener("DOMContentLoaded",function(){var f=document.getElementById("fwinfo");if(f)f.innerHTML=isPS4?"Detected Firmware: "+fwVersion:"PS4 browser required for jailbreak";});
</script>
<div class="g2all-center">
  <img class="hero-logo" src="ps4-jailbreak-logo.png" alt="PS4 Jailbreak">
  <h1 class="g2all-title">PS4 Jailbreak <span class="gold">7.00 - 13.00</span></h1>
  <p class="g2all-sub">FAST &nbsp;•&nbsp; CLEAN &nbsp;•&nbsp; OFFLINE</p>
  <div class="status-card"><div class="status-label"><span class="dot"></span> SYSTEM STATUS</div><h1 id="msgs" class="g2all-msg">Loading GoldHEN v2.4b18.10... Please Wait</h1><div class="divider"></div><div class="meta" id="fwinfo">Detecting PS4 firmware...</div></div><div class="g2all-footer">PS4 Host by ZoLDiK</div>
</div>
</body>
</html>
